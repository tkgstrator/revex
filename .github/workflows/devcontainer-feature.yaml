name: Dev Container Feature

on:
  pull_request:
    paths:
      - src/revex/**
      - test/revex/**
      - docs/devcontainer-feature.md
      - .github/workflows/devcontainer-feature.yaml
  push:
    branches:
      - master
    paths:
      - src/revex/**
      - test/revex/**
      - docs/devcontainer-feature.md
      - .github/workflows/devcontainer-feature.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    name: Feature wrapper fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check metadata and shell scripts
        run: |
          python3 -m json.tool src/revex/devcontainer-feature.json >/dev/null
          sh -n src/revex/install.sh test/revex/test.sh test/revex/smoke.sh
      - name: Test wrapper without installing on host
        run: sh test/revex/smoke.sh
      - name: Stage only the Revex Feature
        run: |
          mkdir -p .feature-publish
          cp -R src/revex .feature-publish/
      - name: Validate the exact publish payload
        uses: devcontainers/action@v1
        with:
          validate-only: 'true'
          base-path-to-features: ./.feature-publish
      - name: Install Dev Container CLI
        run: npm install --global @devcontainers/cli
      - uses: oras-project/setup-oras@v2
        with:
          version: 1.3.0
      - name: Check packaged OCI artifact
        run: |
          set -euo pipefail
          devcontainer features package ./.feature-publish/revex --output-folder "$RUNNER_TEMP/revex-package"
          archive="$RUNNER_TEMP/revex-package/devcontainer-feature-revex.tgz"
          test -s "$archive"
          tar -xOzf "$archive" ./devcontainer-feature.json |
            jq -e --arg version "$(jq -r .version src/revex/devcontainer-feature.json)" \
              '.id == "revex" and .version == $version' >/dev/null
          metadata=$(jq -c . src/revex/devcontainer-feature.json)
          printf '{}' > "$RUNNER_TEMP/revex-config.json"
          mkdir -p "$RUNNER_TEMP/revex-oci"
          cd "$RUNNER_TEMP/revex-package"
          oras push --oci-layout --image-spec v1.0 \
            --config "$RUNNER_TEMP/revex-config.json:application/vnd.devcontainers" \
            --annotation "dev.containers.metadata=$metadata" \
            --annotation 'com.github.package.type=devcontainer_feature' \
            --annotation 'org.opencontainers.image.source=https://github.com/tkgstrator/revex' \
            "$RUNNER_TEMP/revex-oci:check" \
            'devcontainer-feature-revex.tgz:application/vnd.devcontainers.layer.v1+tar'
          oras manifest fetch --oci-layout "$RUNNER_TEMP/revex-oci:check" |
            jq -e '.mediaType == "application/vnd.oci.image.manifest.v1+json" and .config.mediaType == "application/vnd.devcontainers" and .layers[0].mediaType == "application/vnd.devcontainers.layer.v1+tar" and .layers[0].annotations["org.opencontainers.image.title"] == "devcontainer-feature-revex.tgz" and .annotations["com.github.package.type"] == "devcontainer_feature" and (.annotations["dev.containers.metadata"] | fromjson | .id) == "revex"' >/dev/null

  container:
    name: Feature install (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - name: Install Dev Container CLI
        run: npm install --global @devcontainers/cli
      - name: Test release install in a container
        run: devcontainer features test -f revex --base-image ubuntu:24.04 .

  publish:
    name: Publish to GHCR
    needs: [fixture, container]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Dev Container CLI
        run: npm install --global @devcontainers/cli
      - uses: oras-project/setup-oras@v2
        with:
          version: 1.3.0
      - name: Publish ghcr.io/tkgstrator/revex
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(jq -r .version src/revex/devcontainer-feature.json)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Feature version must be numeric semver" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          printf '%s' "$GITHUB_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tags=$(oras repo tags ghcr.io/tkgstrator/revex --format json)
          jq -e '.tags | type == "array"' <<< "$tags" >/dev/null
          if jq -e --arg version "$version" '.tags | index($version) != null' <<< "$tags" >/dev/null; then
            oras tag "ghcr.io/tkgstrator/revex:$version" "$major.$minor" "$major" latest
            echo "Revex Feature $version is already published; aliases restored"
            exit 0
          fi
          devcontainer features package src/revex --output-folder "$RUNNER_TEMP/revex-package"
          metadata=$(jq -c . src/revex/devcontainer-feature.json)
          printf '{}' > "$RUNNER_TEMP/revex-config.json"
          cd "$RUNNER_TEMP/revex-package"
          oras push --image-spec v1.0 \
            --config "$RUNNER_TEMP/revex-config.json:application/vnd.devcontainers" \
            --annotation "dev.containers.metadata=$metadata" \
            --annotation 'com.github.package.type=devcontainer_feature' \
            --annotation 'org.opencontainers.image.source=https://github.com/tkgstrator/revex' \
            "ghcr.io/tkgstrator/revex:$version,$major.$minor,$major,latest" \
            'devcontainer-feature-revex.tgz:application/vnd.devcontainers.layer.v1+tar'
